name: Bug report
description: Report a reproducible collection, service, or viewer problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, private pages, vault contents, or unsanitized logs.
        Report security vulnerabilities through Security → Advisories.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Browser extension
        - Windows local service
        - Obsidian viewer
        - Packaging or installation
        - Multiple components
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Component versions
      placeholder: "Extension 1.7.4, service 1.7.4, viewer 1.3.0"
    validations:
      required: true
  - type: input
    id: page_type
    attributes:
      label: Website or page type
      placeholder: "Public CSDN article, Bilibili video, generic article"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a public URL or local fixture when possible.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and sanitized diagnostics
      description: Remove usernames, paths, tokens, filenames, and private text.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private content, personal paths, and account information.
          required: true
