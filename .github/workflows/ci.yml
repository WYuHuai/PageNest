name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            local-server/requirements.txt
            local-server/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r local-server/requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Validate repository metadata and release boundary
        run: python scripts/validate_repository.py
      - name: Lint Python
        run: python -m ruff check local-server/collector local-server/vision_probe.py scripts
      - name: Run Python tests with coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report
      - name: Check all JavaScript syntax
        shell: bash
        run: find extension obsidian-plugin tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors) {
            $errors | Format-List
            exit 1
          }
      - name: Run all JavaScript tests
        shell: bash
        run: for test in tests/test_*.js; do node "$test"; done
      - name: Build and inspect release packages
        run: python scripts/package_release.py --output release-ci
