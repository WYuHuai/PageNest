name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            local-server/requirements.txt
            local-server/requirements-dev.txt
      - run: python -m pip install -r local-server/requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Check all JavaScript syntax
        shell: bash
        run: find extension obsidian-plugin tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run all JavaScript tests
        shell: bash
        run: for test in tests/test_*.js; do node "$test"; done
      - run: python -c "import json, pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in ('extension/manifest.json','obsidian-plugin/hermes-page-viewer/manifest.json')]"
