<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PageNest</title><link rel="stylesheet" href="popup.css"></head><body>
<main><header><div class="logo">P</div><div><h1>PageNest</h1><p><span id="extensionVersion"></span> · <span id="domain">正在读取当前网页…</span></p></div></header>
<section class="card"><h2 id="title">当前网页</h2><div class="stats"><span id="status">正在识别网页正文……</span><span id="length">— 字</span><span id="images">— 张图片</span></div></section>
<label>保存模式<select id="mode"><option value="original">完整保存网页（不调用 AI，推荐）</option><option value="quick">完整保存 + AI 文字总结</option><option value="deep">完整保存 + AI 图文总结</option></select></label>
<label>保存位置</label><div class="folder-row"><select id="category"><option value="auto">智能整理自动判断</option><option value="阅读记录/待整理">阅读记录/待整理</option></select><button id="refreshFolders" type="button">刷新</button></div><small id="folderStatus">正在读取 Obsidian 文件夹…</small>
<label>我的收藏备注<textarea id="note" rows="3" placeholder="记录为什么收藏、准备怎么使用（可不填）"></textarea></label>
<div id="progress" class="progress hidden"></div><div id="result" class="card hidden"></div>
<div class="buttons"><button id="save" class="primary">保存到 Obsidian</button><button id="retry">重新识别正文</button><button id="cancel">取消</button></div>
<details><summary>连接设置</summary>
<h3>本地收藏服务</h3>
<label>服务地址<input id="server" value="http://127.0.0.1:8765"></label>
<label>收藏器令牌<input id="token" type="password" placeholder="通常由安装程序自动配置"></label>
<button id="saveSettings">保存并检查收藏服务</button><small id="connection"></small>
<div class="settings-separator"></div>
<h3>智能整理接口 <span>OpenAI 兼容</span></h3>
<p class="settings-help">所有服务都只需填写这一套。LM Studio 的 API Key 留空即可。</p>
<label>Base URL<input id="aiUrl" placeholder="例如 http://127.0.0.1:1234/v1"></label>
<label>模型名称<input id="aiModel" placeholder="接口提供的模型 ID"></label>
<label>API Key<input id="aiKey" type="password" autocomplete="off" placeholder="本地模型通常留空"></label>
<button id="saveAiSettings">保存并测试智能整理接口</button><small id="aiConnection"></small>
</details>
</main><script src="capture-selection.js"></script><script src="connection-config.js"></script><script src="core/connection.js"></script><script src="popup.js"></script></body></html>
