<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>安装 PageNest 浏览器扩展</title><style>body{font:16px/1.7 system-ui;max-width:760px;margin:48px auto;padding:0 24px;color:#172033}code{background:#eef2f7;padding:.15em .4em;border-radius:5px}section{padding:20px 24px;background:#f6f8fb;border-radius:14px}h1{color:#4057c8}</style></head>
<body><h1>安装 PageNest 浏览器扩展</h1><section><ol><li>打开 <code>edge://extensions</code> 或 <code>chrome://extensions</code>。</li><li>开启“开发人员模式”。</li><li>点击“加载解压缩的扩展”，选择 PageNest 安装目录中的 <code>Extension</code> 文件夹。</li><li>打开 PageNest 扩展即可使用；本地服务地址和连接令牌已经由安装程序配置。</li></ol><p>扩展正式上架浏览器商店后，这一步会替换为商店中的“安装”按钮。</p></section></body></html>
