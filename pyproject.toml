[tool.ruff]
target-version = "py311"
extend-exclude = [
  "local-server/.venv",
  "release",
  "test-output",
  ".visual-check",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["local-server/collector"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
