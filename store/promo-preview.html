<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PageNest promotional asset</title>
  <style>
    *{box-sizing:border-box}html,body{width:112%;height:112%;margin:0;overflow:hidden}
    body{display:grid;place-items:center;background:radial-gradient(circle at 15% 5%,#45408e 0,#20244d 42%,#0b1020 100%);color:#fff;font-family:Inter,"Segoe UI",system-ui,sans-serif}
    body:before,body:after{content:"";position:absolute;border-radius:50%;filter:blur(1px)}
    body:before{width:55vw;height:55vw;left:-24vw;top:-32vw;background:#6658ff55}
    body:after{width:42vw;height:42vw;right:-18vw;bottom:-28vw;background:#23b9e633}
    main{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:9vw;width:88%;height:80%}
    img{width:min(25vw,300px);height:min(25vw,300px);filter:drop-shadow(0 24px 42px #0008)}
    h1{margin:0;font-size:clamp(46px,6vw,92px);line-height:1;letter-spacing:-.05em}
    p{margin:20px 0 0;color:#cbd3ff;font-size:clamp(18px,2.1vw,31px);line-height:1.4}
    .features{display:flex;gap:12px;margin-top:30px}.features span{padding:9px 14px;border:1px solid #727db1;border-radius:999px;background:#151b36aa;color:#eef1ff;font-size:16px;font-weight:650;letter-spacing:.08em}
    body.small main{gap:18px;width:82%}body.small img{width:88px;height:88px;flex:0 0 auto}body.small section{min-width:0}body.small h1{font-size:38px}body.small p{width:205px;margin-top:9px;font-size:12px;letter-spacing:.08em;font-weight:700}body.small .features{display:none}
  </style>
</head>
<body>
  <main>
    <img src="../assets/pagenest-icon-1024.png" alt="PageNest">
    <section><h1>PageNest</h1><p>Your webpages. Your video notes. Your Vault.</p><div class="features"><span>WEB</span><span>VIDEO</span><span>LOCAL</span></div></section>
  </main>
  <script>if(new URLSearchParams(location.search).get("size")==="small") document.body.classList.add("small");</script>
</body>
</html>
